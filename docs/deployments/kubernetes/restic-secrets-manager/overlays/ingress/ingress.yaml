apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restic-secrets-manager
  labels:
    app: restic-secrets-manager
spec:
  ingressClassName: nginx
  rules:
    # Replace with the host served by your ingress controller.
    - host: restic-secrets-manager.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restic-secrets-manager
                port:
                  name: http
