apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: restic-secrets-manager
# Opt-in overlay: apply it only when an Ingress controller is the sole path
# to the application AND it overwrites client-supplied X-Forwarded-For
# (see the Kubernetes README). It enables TRUST_PROXY so rate limiting and
# audit logs see the real client IP.
resources:
  - ../../base
  - ingress.yaml
images:
  - name: restic-secrets-manager
    newTag: latest
    newName: devopsplaybookio/restic-secrets-manager
patches:
  - path: trust-proxy-patch.yaml
