apiVersion: v1
kind: Secret
metadata:
  name: restic-secrets-manager
  labels:
    app: restic-secrets-manager
type: Opaque
stringData:
  # Optional: leave empty to let the application generate a signing key once
  # and keep it in the database. Set a strong random key (e.g.
  # `openssl rand -base64 48`) to manage it yourself; anyone holding this key
  # can forge authentication sessions, and changing it invalidates all
  # issued sessions.
  JWT_KEY: ""
