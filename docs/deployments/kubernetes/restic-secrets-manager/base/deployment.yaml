apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-secrets-manager
  labels:
    app: restic-secrets-manager
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: restic-secrets-manager
  template:
    metadata:
      labels:
        app: restic-secrets-manager
    spec:
      containers:
        - image: restic-secrets-manager
          name: restic-secrets-manager
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: restic-secrets-manager
                  key: JWT_KEY
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 100Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: restic-secrets-manager
