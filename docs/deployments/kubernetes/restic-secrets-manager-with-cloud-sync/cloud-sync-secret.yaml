apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-secrets-cloud-sync-config
  namespace: restic-secrets-manager
  labels:
    app: kubernetes-secrets-cloud-sync
type: Opaque
stringData:
  # WARNING: all values below are placeholders — replace them with the settings
  # of the restic repository you want to sync from (the same settings as the
  # corresponding project in restic-secrets-manager).
  #
  # Repository of the project to sync, in the form
  # s3:https://<endpoint>/<bucket>/<prefix>. Example with generic values:
  RESTIC_REPOSITORY: s3:https://s3.example.com/my-bucket/my-project
  # Repository password (the one configured on the restic-secrets-manager project):
  RESTIC_PASSWORD: CHANGE_ME
  # S3 credentials with read access to the bucket:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  # Secrets are pushed by restic-secrets-manager under the "secrets/" folder of
  # the repository — this is what makes the two tools work together:
  RESTIC_PATH: secrets
