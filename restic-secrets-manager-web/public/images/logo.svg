<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Abstract locked-box logo: an archive box with a padlock -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155d8a"/>
      <stop offset="1" stop-color="#0a3a57"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#c3ccd3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Box body -->
  <rect x="112" y="200" width="288" height="192" rx="24" fill="url(#box)"/>
  <!-- Box lid -->
  <rect x="96" y="136" width="320" height="72" rx="20" fill="#f7f9fa"/>
  <!-- Lid seam -->
  <rect x="112" y="200" width="288" height="14" rx="7" fill="#aab6bf"/>

  <!-- Padlock shackle -->
  <path d="M216 136 v-24 a40 40 0 0 1 80 0 v24"
        fill="none" stroke="#f7f9fa" stroke-width="26" stroke-linecap="round"/>
  <!-- Padlock body -->
  <rect x="204" y="252" width="104" height="92" rx="18" fill="#155d8a"/>
  <!-- Keyhole -->
  <circle cx="256" cy="290" r="14" fill="#e9eef2"/>
  <rect x="249" y="296" width="14" height="28" rx="7" fill="#e9eef2"/>
</svg>
